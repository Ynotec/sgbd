<div class="card">
    <span class="title">Compteur</span>
    <span class="count" [class.negative]="count < 0">{{ count }}</span>
    <div class="controls">
        <button class="btn-remove" (click)="removeCount()">−</button>
        <button class="btn-clear" (click)="clearCount()">RAZ</button>
        <button class="btn-add" (click)="addCount()">+</button>
    </div>
</div>
