<mat-card appearance="outlined">
    <mat-card-header>
        <mat-card-title>Météo</mat-card-title>
        <mat-card-subtitle> {{ feedback }}</mat-card-subtitle>
    </mat-card-header>
    <form>
        <mat-form-field>
            <mat-label>Taper le nom d'une ville</mat-label>
            <input matInput placeholder="Ex. Charleroi">
        </mat-form-field>
    </form>
    <mat-card-actions>
        <button mat-stroked-button >Voir</button>
        <button mat-stroked-button >Me localiser</button>
    </mat-card-actions>
    
</mat-card>
